[pytest]

testpaths =
    tests/cares_connect/smoke
    tests/carestream/smoke
    tests/ddx/smoke
    tests/io_scanner/smoke
    tests/ori_portal/smoke
    tests/axs_straumann/smoke
pythonpath = .
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*

addopts =
    -v
    --tb=short
    -p no:cacheprovider
    --alluredir=reports/allure-results
    --html=reports/combined-report/index.html
    --self-contained-html
    --junitxml=reports/combined-report/junit.xml

markers =
    smoke
    sanity
    regression
    rpa
    ddx: DDX application tests
    carestream: Carestream application tests
    cares_connect: CARES Connect application tests
    io_scanner: IO Scanner application tests
    ori_portal: ORI Portal application tests
    axs_straumann: AXS Straumann application tests
